version: "3"

services:
  strapi:
    build:
      context: ./backend
    container_name: strapi
    environment:
      - DATABASE_CLIENT=mysql
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_NAME=strapi
      - DATABASE_USERNAME=strapi
      - DATABASE_PASSWORD=strapi
    ports:
      - 1337:1337
    links:
      - db:db
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1337/_health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  db:
    container_name: mysql
    image: mysql:8.4.0
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: strapi
      MYSQL_USER: strapi
      MYSQL_PASSWORD: strapi
      MYSQL_ROOT_PASSWORD: strapi

  consumer:
    build:
      context: ./async-server-provisioner
      dockerfile: Dockerfile-dev
    container_name: consumer
    command: ["npm", "run", "watch"]
    links:
      - db:db
    depends_on:
      strapi:
        condition: service_healthy
    environment:
      - MYSQL_HOST=db
      - TERRAFORM_PATH=/opt/terraform/02-game-server
      - HCLOUD_TOKEN=${HCLOUD_TOKEN}
      - CLOUD_GAME_API_TOKEN=${CLOUD_GAME_API_TOKEN}
    volumes:
      - ~/.aws:/root/.aws
      - ./async-server-provisioner:/usr/src/app
      - /usr/src/app/node_modules
      - ./infrastructure/terraform:/opt/terraform
